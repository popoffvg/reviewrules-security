name: pr-title
on:
  pull_request:
    types: [opened, edited]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Print title
        run: echo "Title: ${{ github.event.pull_request.title }}"
      - name: Check branch
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          echo "Branch: $HEAD_REF at ${{ github.sha }}"
