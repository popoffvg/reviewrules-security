apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
spec:
  replicas: 2
  selector:
    matchLabels: {app: worker}
  template:
    metadata:
      labels: {app: worker}
    spec:
      containers:
        - name: worker
          image: registry.example.com/worker:1.4.2
          securityContext:
            privileged: true
        - name: metrics
          image: registry.example.com/metrics-sidecar:0.9.0
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
